<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>교대알람 · 근무표 받기</title>
<meta property="og:title" content="교대알람 근무표가 도착했어요 · RotaWake">
<meta property="og:description" content="눌러서 교대알람에서 보기 · Tap to view in RotaWake">
<meta property="og:site_name" content="RotaWake 교대알람">
<meta property="og:image" content="https://danielpark64.github.io/alarm-ios/s/icon.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="교대알람 근무표가 도착했어요 · RotaWake">
<meta name="twitter:description" content="눌러서 교대알람에서 보기 · Tap to view in RotaWake">
<meta name="twitter:image" content="https://danielpark64.github.io/alarm-ios/s/icon.png">
<meta name="description" content="눌러서 교대알람에서 보기 · Tap to view in RotaWake">
<!--
  교대알람 근무표 공유 안내 페이지(빌드 10~). 앱의 [보내기]가 만드는 짧은 링크:
    https://danielpark64.github.io/alarm-ios/s/#v2.<base64url(근무표)>    (옛 링크 s.html#v=1&i=…&p=… 도 같은 방식으로 연다)
  메신저 미리보기 카드: og:title·og:description·og:image(같은 폴더 icon.png, 절대 주소) — 세이람 s 페이지와 같은 방식, 한국어+영어 병기.
  데이터는 # 뒤에만 있다 — 브라우저는 # 뒤를 서버로 보내지 않는다. 이 페이지는 외부 파일·분석 도구를 전혀 불러오지 않고,
  # 뒤를 그대로 붙여 1.6.0에서 새로 등록한 앱 주소(alarmappshare://)로 연다(앱 쪽 규칙: src/utils/shiftShareLink.ts appLinkFromPage).
  옛 버전(1.5.x 이하)은 이 주소를 몰라 앱이 열리지 않으므로 1.5초 안에 화면이 가려지지 않으면 "최신 버전이 필요해요"와 스토어 버튼을 보인다.
-->
<style>
  :root { color-scheme: light dark; --bg:#f5f6fa; --card:#fff; --ink:#16162a; --mute:#5a5a78; --line:#dcdcea; --acc:#6c5ce7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0b1c; --card:#15152e; --ink:#f0f0ff; --mute:#b4b4d0; --line:#2a2a50; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  main { max-width:460px; margin:0 auto; padding:40px 20px 48px; }
  h1 { font-size:24px; line-height:1.3; margin:0 0 8px; }
  p { margin:0 0 14px; color:var(--mute); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px; margin-top:18px; }
  .btn { display:block; width:100%; text-align:center; text-decoration:none; font-weight:800; font-size:17px; border-radius:14px; padding:15px; border:0; cursor:pointer; }
  .open { background:var(--acc); color:#fff; }
  .store { background:transparent; color:var(--ink); border:1.5px solid var(--line); margin-top:10px; font-size:15px; padding:12px; }
  .need { display:none; border-color:var(--acc); }
  .need.show { display:block; }
  .need h2 { font-size:18px; margin:0 0 6px; }
  .small { font-size:13px; margin-top:16px; }
  .err { display:none; color:#d9534f; font-weight:700; }
</style>
</head>
<body>
<main>
  <h1 id="title">근무표가 도착했어요</h1>
  <p id="lead">교대알람에서 열면 달력에 그 사람의 근무표 창이 생겨요. 보기만 하고 알람은 울리지 않아요.</p>
  <p class="err" id="broken">링크가 잘렸어요. 보낸 사람에게 다시 보내 달라고 해 주세요.</p>

  <div class="card">
    <button class="btn open" id="open">교대알람에서 열기</button>
    <p class="small" id="hint">앱이 열렸는데 아무 일도 없으면 최신 버전으로 업데이트한 뒤 이 링크를 다시 누르세요.</p>
  </div>

  <div class="card need" id="need">
    <h2 id="needTitle">앱이 열리지 않았나요?</h2>
    <p id="needText">최신 버전이 필요해요. 교대알람이 없거나 옛 버전이면 열리지 않아요. 설치·업데이트한 뒤 이 링크를 다시 누르세요.</p>
  </div>

  <div id="stores">
    <a class="btn store" id="ios" href="https://apps.apple.com/app/id6825757463">App Store</a>
    <a class="btn store" id="android" href="https://play.google.com/store/apps/details?id=com.danielpark.alarmapp">Google Play</a>
  </div>
  <p class="small" id="privacy">근무표는 이 링크 안에만 들어 있고 서버에 저장되지 않아요.</p>
</main>
<script>
(function () {
  var T = {
    ko: ['근무표가 도착했어요', '교대알람에서 열면 달력에 그 사람의 근무표 창이 생겨요. 보기만 하고 알람은 울리지 않아요.', '교대알람에서 열기', '앱이 열렸는데 아무 일도 없으면 최신 버전으로 업데이트한 뒤 이 링크를 다시 누르세요.', '앱이 열리지 않았나요?', '최신 버전이 필요해요. 교대알람이 없거나 옛 버전이면 열리지 않아요. 설치·업데이트한 뒤 이 링크를 다시 누르세요.', '근무표는 이 링크 안에만 들어 있고 서버에 저장되지 않아요.', '링크가 잘렸어요. 보낸 사람에게 다시 보내 달라고 해 주세요.'],
    en: ['A shift schedule for you', 'Open it in RotaWake to add a tab with their schedule to your calendar. View only — it never rings an alarm.', 'Open in RotaWake', 'If the app opens but nothing happens, update to the latest version and tap this link again.', 'Didn’t the app open?', 'You need the latest version. It won’t open if RotaWake isn’t installed or is out of date. Install or update it, then tap this link again.', 'The schedule lives only inside this link and is never stored on a server.', 'This link is cut off. Ask the sender to send it again.'],
    ja: ['シフト表が届きました', 'RotaWakeで開くと、カレンダーにその人のシフト表タブができます。見るだけで、アラームは鳴りません。', 'RotaWakeで開く', 'アプリが開いても何も起きないときは、最新版にアップデートしてからもう一度このリンクを押してください。', 'アプリが開きませんでしたか?', '最新版が必要です。RotaWakeが入っていないか古いバージョンだと開きません。インストール・アップデートしてからもう一度このリンクを押してください。', 'シフト表はこのリンクの中にだけあり、サーバーには保存されません。', 'リンクが途中で切れています。送った人にもう一度送ってもらってください。'],
    'zh-Hans': ['收到一份排班表', '在RotaWake中打开，日历上会出现此人的排班标签。仅供查看，不会响闹钟。', '在RotaWake中打开', '如果应用打开后没有反应，请更新到最新版本后再点一次此链接。', '应用没有打开吗?', '需要最新版本。未安装 RotaWake 或版本过旧时无法打开。安装或更新后请再点一次此链接。', '排班表只保存在此链接中，不会存储到服务器。', '链接不完整。请让对方重新发送。'],
    'zh-Hant': ['收到一份班表', '在RotaWake中開啟，行事曆上會出現此人的班表分頁。僅供查看，不會響鬧鐘。', '在RotaWake中開啟', '如果 App 開啟後沒有反應，請更新到最新版本後再點一次此連結。', 'App 沒有開啟嗎?', '需要最新版本。尚未安裝 RotaWake 或版本過舊時無法開啟。安裝或更新後請再點一次此連結。', '班表只存在於此連結中，不會儲存到伺服器。', '連結不完整。請對方重新傳送。'],
    es: ['Te han enviado un horario de turnos', 'Ábrelo en RotaWake para añadir a tu calendario una pestaña con su horario. Solo para ver: nunca hace sonar una alarma.', 'Abrir en RotaWake', 'Si la app se abre pero no pasa nada, actualízala a la última versión y vuelve a tocar este enlace.', '¿No se abrió la app?', 'Necesitas la última versión. No se abrirá si RotaWake no está instalada o está desactualizada. Instálala o actualízala y vuelve a tocar este enlace.', 'El horario solo está dentro de este enlace y nunca se guarda en un servidor.', 'El enlace está cortado. Pide que te lo vuelvan a enviar.'],
    fr: ['Un planning de travail pour vous', 'Ouvrez-le dans RotaWake pour ajouter un onglet avec son planning à votre calendrier. Consultation seule : aucune alarme ne sonne.', 'Ouvrir dans RotaWake', 'Si l’app s’ouvre mais que rien ne se passe, mettez-la à jour puis touchez à nouveau ce lien.', 'L’app ne s’est pas ouverte ?', 'La dernière version est nécessaire. L’app ne s’ouvre pas si RotaWake n’est pas installée ou pas à jour. Installez-la ou mettez-la à jour, puis touchez à nouveau ce lien.', 'Le planning se trouve uniquement dans ce lien et n’est jamais enregistré sur un serveur.', 'Ce lien est coupé. Demandez à l’expéditeur de le renvoyer.'],
    de: ['Ein Dienstplan für dich', 'Öffne ihn in RotaWake, um deinem Kalender einen Tab mit diesem Dienstplan hinzuzufügen. Nur zum Ansehen – es klingelt nie ein Wecker.', 'In RotaWake öffnen', 'Wenn sich die App öffnet, aber nichts passiert, aktualisiere sie und tippe den Link noch einmal an.', 'Hat sich die App nicht geöffnet?', 'Die neueste Version wird benötigt. Ohne RotaWake oder mit einer alten Version öffnet sich nichts. Installiere oder aktualisiere die App und tippe den Link noch einmal an.', 'Der Dienstplan steckt nur in diesem Link und wird nie auf einem Server gespeichert.', 'Der Link ist abgeschnitten. Bitte den Absender, ihn noch einmal zu senden.'],
    pt: ['Você recebeu uma escala de turnos', 'Abra no RotaWake para adicionar ao seu calendário uma aba com a escala dessa pessoa. Só para ver — nunca toca alarme.', 'Abrir no RotaWake', 'Se o app abrir e nada acontecer, atualize para a versão mais recente e toque neste link de novo.', 'O app não abriu?', 'É preciso a versão mais recente. Ele não abre se o RotaWake não estiver instalado ou estiver desatualizado. Instale ou atualize e toque neste link de novo.', 'A escala fica só dentro deste link e nunca é salva em um servidor.', 'O link está cortado. Peça para enviarem de novo.']
  };
  var nav = (navigator.language || 'ko').toLowerCase();
  var lang = /^zh/.test(nav) ? (/(hant|tw|hk|mo)/.test(nav) ? 'zh-Hant' : 'zh-Hans') : nav.slice(0, 2);
  if (!T[lang]) lang = 'en';
  var L = T[lang];
  document.documentElement.lang = lang;
  ['title', 'lead', 'open', 'hint', 'needTitle', 'needText', 'privacy', 'broken'].forEach(function (id, i) { document.getElementById(id).textContent = L[i]; });

  var frag = location.hash.slice(1);
  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
  // 기기에 맞는 스토어를 먼저
  if (isAndroid) document.getElementById('stores').insertBefore(document.getElementById('android'), document.getElementById('ios'));
  if (!/(^|&)p=/.test(frag) && !/^v2\.[A-Za-z0-9_-]{8,}$/.test(frag)) { document.getElementById('broken').style.display = 'block'; document.getElementById('open').disabled = true; }

  var appUrl = 'alarmappshare://?' + frag;
  function showNeed() { document.getElementById('need').className = 'card need show'; }
  var timer = null;
  function cancel() { if (timer) { clearTimeout(timer); timer = null; } }
  document.addEventListener('visibilitychange', function () { if (document.hidden) cancel(); });
  window.addEventListener('pagehide', cancel);
  window.addEventListener('blur', cancel);
  function openApp() {
    cancel();
    // 1.5초 안에 앱으로 넘어가 이 화면이 가려지지 않으면 = 앱이 없거나 옛 버전(새 주소를 모름)
    timer = setTimeout(function () { timer = null; if (!document.hidden) showNeed(); }, 1500);
    // Android는 intent:// 주소로 연다 — LINE·카톡·페이스북 같은 메신저 안 브라우저(WebView)는 alarmappshare://를
    // 막거나 무시하는 경우가 많지만 intent://는 대부분 앱으로 넘긴다. 앱이 없거나 옛 버전이면 Play 스토어로 간다.
    location.href = isAndroid
      ? 'intent://?' + frag + '#Intent;scheme=alarmappshare;package=com.danielpark.alarmapp;S.browser_fallback_url=' +
        encodeURIComponent('https://play.google.com/store/apps/details?id=com.danielpark.alarmapp') + ';end'
      : appUrl;
  }
  document.getElementById('open').addEventListener('click', openApp);
  // 들어오자마자 자동으로 열지 않는다 — Android Chrome은 사용자 탭 없이 앱을 못 열어(자동 시도는 조용히 실패 → '최신 버전 필요'가 잘못 뜸),
  // iOS Safari는 앱이 없을 때 '주소가 유효하지 않음' 경고를 띄운다. 버튼 한 번 누르기로 연다.
})();
</script>
</body>
</html>
